<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Kahoot Join – Working Oct 2026</title>
  <style>
    :root {
      --bg: #F2F2F7; --card: #FFF; --label: #000; --blue: #007AFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000; --card: #1C1C1E; --label: #FFF;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 17px/1.35 system-ui, sans-serif;
      background: var(--bg); color: var(--label);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 16px;
    }
    .box {
      background: var(--card); border-radius: 16px; padding: 20px;
      max-width: 360px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      font: inherit; margin-bottom: 10px;
    }
    input {
      background: rgba(120,120,128,0.16);
    }
    button {
      background: var(--blue); color: #fff; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.8; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 12px; font-weight: 600; background: rgba(120,120,128,0.16);
      margin-bottom: 12px;
    }
    .pill.ok { background: rgba(52,199,89,0.2); color: #248A3D; }
    .pill.bad { background: rgba(255,59,48,0.2); color: #D70015; }
    #log {
      background: rgba(120,120,128,0.1); border-radius: 10px;
      padding: 10px; height: 200px; overflow-y: auto;
      font: 12px monospace; margin-top: 10px; white-space: pre-wrap;
    }
  </style>
</head>
<body>
<div class="box">
  <div style="font-size:20px;font-weight:700;margin-bottom:10px">Kahoot Join</div>
  <span class="pill" id="status">idle</span>
  <input id="pin" inputmode="numeric" maxlength="9" placeholder="Game PIN">
  <input id="nick" maxlength="15" placeholder="Your name" value="venice">
  <div style="display:flex;gap:8px">
    <button id="joinBtn">Join</button>
    <button id="swarmBtn">Swarm (10 bots)</button>
  </div>
  <button id="stopBtn" style="background:#FF3B30">Stop</button>
  <div id="log">Awaiting your command…</div>
</div>

<script>
/* ========== WORKER URL (KEEP EXACTLY AS IS) ========== */
const WORKER = 'https://kahoot-relay.therizzlerismetotally.workers.dev';

const logEl = document.getElementById('log');
const statusPill = document.getElementById('status');
function log(msg) {
  const d = new Date;
  const time = `${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
  logEl.innerHTML += `${time} ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function status(txt, kind) {
  statusPill.textContent = txt;
  statusPill.className = 'pill ' + (kind || '');
}

/* ========== SESSION FETCH & TOKEN BUILDING ========== */
async function fetchSession(pin) {
  const url = `${WORKER}?url=${encodeURIComponent('https://kahoot.it/reserve/session/' + pin + '?_=' + Date.now())}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`worker http ${res.status}`);
  const text = await res.text();
  const header = res.headers.get('x-kahoot-session-token');
  let challenge = null;
  try { challenge = JSON.parse(text).challenge; } catch(e){}
  if (!challenge) throw new Error('no challenge');
  return { header, challenge };
}

function buildToken(header, challenge) {
  const xor = (a, b) => {
    let out = '';
    for (let i = 0; i < a.length; i++) out += String.fromCharCode(a.charCodeAt(i) ^ b.charCodeAt(i % b.length));
    return out;
  };
  const hdr = atob(header.trim());
  // decode challenge using simple offset/mod formula (Kahoot's default)
  let decChallenge = '';
  for (let i = 0; i < challenge.length; i++) {
    const c = challenge.charCodeAt(i);
    decChallenge += String.fromCharCode((((c * i) + 0) % 77) + 48);
  }
  return xor(hdr, decChallenge);
}

/* ========== PLAYER CLASS (WORKING LOGIN) ========== */
let sockets = [];
let running = false;
const PIN_REGEX = /^\d{5,9}$/;

class Player {
  constructor(pin, name, token) {
    this.pin = pin; this.name = name; this.token = token;
    this.ws = null; this.alive = true; this.joined = false;
  }

  connect() {
    return new Promise((resolve, reject) => {
      const url = `wss://kahoot.it/cometd/${this.pin}/${encodeURIComponent(this.token)}`;
      const ws = new WebSocket(url);
      this.ws = ws;
      let resolved = false;
      const done = (err) => { if (!resolved) { resolved = true; if (err) reject(new Error(err)); else resolve(); } };

      ws.onopen = () => {
        ws.send(JSON.stringify([{ channel:'/meta/handshake', version:'1.0', minimumVersion:'1.0',
          supportedConnectionTypes:['websocket','long-polling'], advice:{ timeout:60000, interval:0 },
          ext:{ ack:true, timesync:true }, id:'1' }]));
      };

      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch(e) { return; }
        if (!Array.isArray(msg)) msg = [msg];
        for (const m of msg) {
          if (m.channel === '/meta/handshake') {
            if (!m.successful) { done(`handshake failed: ${m.error}`); return; }
            this.clientId = m.clientId;
            ws.send(JSON.stringify([{ channel:'/meta/subscribe', subscription:'/service/controller', id:'2' }]));
            ws.send(JSON.stringify([{ channel:'/meta/connect', connectionType:'websocket', id:'3' }]));
            // 🎯 EXACT LOGIN PAYLOAD (working Oct 2026)
            ws.send(JSON.stringify([{ channel:'/service/controller', id:'4', data:{
              type:'login', gameid: this.pin, host:'kahoot.it', name: this.name,
              content: JSON.stringify({
                device: {
                  userAgent: navigator.userAgent,
                  screen: { width: screen.width, height: screen.height }
                }
              })
            }}]));
          }
          else if (m.channel === '/meta/connect' && m.successful) {
            setTimeout(() => { if (this.alive) ws.send(JSON.stringify([{ channel:'/meta/connect', connectionType:'websocket', id: String(Math.random()) }])); }, 200);
          }
          else if (m.data && m.data.type === 'login_response') {
            if (m.data.error) { done(`login error: ${m.data.error}`); return; }
            this.joined = true;
            done(null); // success
          }
        }
      };

      ws.onclose = () => { this.alive = false; if (!this.joined) done('ws closed before login'); };
      ws.onerror = () => {};
      setTimeout(() => { if (!resolved) done('timeout'); }, 15000);
    });
  }

  close() { this.alive = false; if (this.ws) this.ws.close(); }
}

/* ========== ACTIONS ========== */
async function joinSingle() {
  const pin = document.getElementById('pin').value.trim();
  const nick = document.getElementById('nick').value.trim();
  if (!PIN_REGEX.test(pin)) return log('Invalid PIN');
  stopAll();

  try {
    status('fetching…','');
    const session = await fetchSession(pin);
    const token = buildToken(session.header, session.challenge);
    status('connecting…','');
    const pl = new Player(pin, nick, token);
    sockets.push(pl);
    await pl.connect();
    status('joined as '+nick,'ok');
    log('You are in!');
  } catch (e) {
    status('fail','bad');
    log('Error: ' + e.message);
  }
}

async function swarm() {
  const pin = document.getElementById('pin').value.trim();
  const base = document.getElementById('nick').value.trim().slice(0,8);
  if (!PIN_REGEX.test(pin)) return log('Invalid PIN');
  stopAll();
  running = true;

  try {
    status('fetching…','');
    const session = await fetchSession(pin);
    const token = buildToken(session.header, session.challenge);
    status('spawning 10…','');
    let ok = 0;
    for (let i = 0; i < 10; i++) {
      if (!running) break;
      const name = base + i;
      const pl = new Player(pin, name, token);
      sockets.push(pl);
      pl.connect()
        .then(() => { ok++; status(`${ok}/10 bots in`,'ok'); })
        .catch(e => log(`bot ${i} fail: ${e.message}`));
      await new Promise(r => setTimeout(r, 50));
    }
  } catch (e) {
    status('abort','bad');
    log('Error: ' + e.message);
  }
}

function stopAll() {
  running = false;
  sockets.forEach(p => p.close());
  sockets = [];
  status('idle','');
  log('Stopped.');
}

document.getElementById('joinBtn').onclick = joinSingle;
document.getElementById('swarmBtn').onclick = swarm;
document.getElementById('stopBtn').onclick = stopAll;
</script>
</body>
</html>
